<app-section
  label="FAQ"
  maxWidth="max-w-3xl"
  sectionId="faq"
  subtitle="Common questions about Keystone, answered."
  title="Frequently Asked Questions"
  variant="light"
>
  <div class="space-y-3">
    @for (item of faqItems; track item.question; let i = $index) {
      <div [class.border-brand-200]="isOpen(item.question)" class="card overflow-hidden">
        <button
          (click)="toggleFaq(item.question)"
          [attr.aria-controls]="'faq-panel-' + i"
          [attr.aria-expanded]="isOpen(item.question)"
          [id]="'faq-button-' + i"
          class="w-full flex items-center justify-between px-6 py-5 text-left cursor-pointer hover:bg-brand-50/40 transition-colors"
          type="button"
        >
          <span class="font-semibold text-ink text-[15px] pr-4">{{ item.question }}</span>
          <span
            [class.bg-brand-600]="isOpen(item.question)"
            [class.bg-slate-100]="!isOpen(item.question)"
            class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 transition-colors"
          >
            <i
              [class.rotate-180]="isOpen(item.question)"
              [class.text-slate-400]="!isOpen(item.question)"
              [class.text-white]="isOpen(item.question)"
              class="fas fa-chevron-down text-xs transition-transform duration-300"
            ></i>
          </span>
        </button>

        <div
          [attr.aria-labelledby]="'faq-button-' + i"
          [attr.inert]="isOpen(item.question) ? null : ''"
          [id]="'faq-panel-' + i"
          [style.gridTemplateRows]="isOpen(item.question) ? '1fr' : '0fr'"
          class="grid transition-[grid-template-rows] duration-300 ease-out motion-reduce:transition-none"
          role="region"
        >
          <div class="overflow-hidden">
            <div class="px-6 pb-5 text-slate-500 text-sm leading-relaxed">
              {{ item.answer }}
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</app-section>

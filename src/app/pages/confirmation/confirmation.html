<app-section
  label="Message Sent"
  maxWidth="max-w-2xl"
  sectionId="confirmation"
  variant="hero"
>
  <div class="pt-12 flex flex-col items-center text-center gap-8">

    <!-- Animated icon -->
    <div class="relative flex items-center justify-center">
      <div class="absolute w-28 h-28 rounded-full bg-brand-500/10 animate-ping" style="animation-duration: 2.5s;"></div>
      <div class="relative w-20 h-20 rounded-full bg-white/8 border border-white/15 flex items-center justify-center">
        <i class="fas fa-paper-plane text-3xl text-brand-400 -rotate-12"></i>
      </div>
    </div>

    <!-- Copy -->
    <div class="space-y-3 max-w-md">
      <h1 class="text-4xl font-display font-bold text-white tracking-tight">
        We'll be in touch.
      </h1>
      <p class="text-lg text-slate-300 leading-relaxed">
        Thanks for reaching out. Someone from our team will get back to you shortly.
      </p>
    </div>

    <!-- Divider -->
    <div class="w-16 h-px bg-white/15"></div>

    <!-- Actions -->
    <div class="flex flex-col sm:flex-row items-center gap-4">
      <a
        class="group bg-gradient-brand text-white px-8 py-3.5 rounded-xl font-semibold transition-all shadow-lg shadow-brand-600/30 hover:shadow-xl hover:shadow-brand-600/40 hover:-translate-y-0.5 flex items-center gap-2"
        routerLink="/"
      >
        <i class="fas fa-arrow-left group-hover:-translate-x-0.5 transition-transform text-sm"></i>
        <span>Back to home</span>
      </a>
    </div>

  </div>
</app-section>

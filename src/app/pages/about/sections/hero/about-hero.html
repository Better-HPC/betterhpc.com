<header class="hero-gradient min-h-screen flex items-center pt-20 relative overflow-hidden">
  <!-- Masked grid texture -->
  <div class="absolute inset-0 grid-texture"></div>

  <div class="max-w-5xl mx-auto px-6 py-32 relative z-10 text-center">
    <!-- Eyebrow badge -->
    <a routerLink="/keystone">
      <div class="fade-up fade-up-1 inline-flex items-center gap-2 glass rounded-full pl-2 pr-4 py-1.5 mb-8">
        <span class="bg-gradient-brand-bright text-slate-950 text-[11px] font-bold uppercase tracking-wide px-2.5 py-0.5 rounded-full">New</span>
        <span class="text-slate-200 text-sm">Meet Keystone — our HPC management platform</span>
      </div>
    </a>

    <h1 class="fade-up fade-up-2 text-5xl sm:text-6xl md:text-7xl font-display font-extrabold tracking-tight mb-6 text-white leading-[1.05]">
      We Make HPC
      <span class="text-brand-gradient">Better</span>
    </h1>

    <p class="fade-up fade-up-3 text-slate-300 text-lg sm:text-xl max-w-2xl mx-auto mb-10 leading-relaxed">
      Solving real-world problems with the next generation of high-performance computing software.
    </p>

    <div class="fade-up fade-up-4 flex flex-wrap justify-center gap-4">
      <a
        class="group bg-gradient-brand text-white px-8 py-4 rounded-xl font-semibold transition-all flex items-center gap-3 shadow-lg shadow-brand-600/30 hover:shadow-xl hover:shadow-brand-600/40 hover:-translate-y-0.5"
        routerLink="/contact">
        Contact Us
        <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
      </a>
      <a
        class="border border-white/20 hover:border-white/40 hover:bg-white/5 text-white px-8 py-4 rounded-xl font-semibold transition-all backdrop-blur-sm"
        href="#software">
        Explore Our Software
      </a>
    </div>
  </div>

  <!-- Scroll indicator -->
  <a
    aria-label="Scroll to content"
    class="absolute bottom-8 left-1/2 -translate-x-1/2 text-slate-500 hover:text-slate-300 transition-colors animate-bounce"
    href="#mission">
    <i class="fas fa-chevron-down"></i>
  </a>
</header>
